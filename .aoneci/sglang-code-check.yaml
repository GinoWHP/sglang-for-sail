# =============================================================================
# CI: pre-commit checks for all Merge Requests
#
# 检查范围:
#   - Python: isort / ruff / black-jupyter
#   - C / C++ / CUDA: clang-format
#   - 通用文件检查
#
# 排除范围:
#   - Rust
#
# 文件位置:
#   - pre-commit 配置: 仓库 根目录/.pre-commit-config.yml
# =============================================================================
name: pre-commit check

strategy:
  concurrency:
    group: '${{git.merge_request.id ?:(git.branch ?:"")}}'
    cancel-in-progress: true

triggers:
  merge_request:
    target-branches:
      - '**'

params:
  compare-to:
    name: Compare Branch
    type: string
    default: '${{git.merge_request.targetBranch ?: ""}}'

jobs:
  pre-commit:
    name: Run pre-commit
    steps:
      # 下载代码
      - uses: checkout

      # Python 环境
      - uses: setup-env
        inputs:
          python-version: "3.10"

      # 缓存 pip + pre-commit
      - uses: cache@1.0.0
        inputs:
          key: precommit-python310-v1
          path: /root/.cache
          policy: pull-push
          on-failure: retain

      # Github Proxy
      - uses: setup-github-proxy

      # 执行检查
      - id: pre-commit
        run: |
          set -eux

          export PRE_COMMIT_HOME=/root/.cache/pre-commit

          echo "========== Current Directory =========="
          pwd
          ls -la
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          echo "========== Repo Root =========="
          pwd
          python --version

          ####################################################################
          # 调试 cache
          ####################################################################
          echo "========== Cache Debug =========="

          echo "HOME=$HOME"

          echo
          echo "pip cache dir:"
          pip cache dir || true

          echo
          echo "/root/.cache:"
          ls -lah /root/.cache || true

          echo
          echo "pre-commit cache:"
          du -sh /root/.cache/pre-commit 2>/dev/null || true

          echo
          echo "pip cache:"
          du -sh /root/.cache/pip 2>/dev/null || true

          ####################################################################
          # 安装 pre-commit
          ####################################################################

          git --version
          python -m pip install \
            --disable-pip-version-check \
            pre-commit==4.6.0
          pre-commit --version

          # 确认配置文件存在
          test -f .pre-commit-config.yaml
          # 当前 CI 不检查 Rust
          export SKIP="rustfmt-sgl-model-gateway,rustfmt-sgl-router"

          TARGET_BRANCH="${{params.compare-to}}"
          echo "========== Target Branch =========="
          echo "$TARGET_BRANCH"
          if [ -n "$TARGET_BRANCH" ]; then
            git fetch origin "$TARGET_BRANCH"
            echo "========== Changed Files =========="
            git diff --name-status \
              "origin/${TARGET_BRANCH}" \
              HEAD || true
            pre-commit run \
              --from-ref "origin/${TARGET_BRANCH}" \
              --to-ref HEAD \
              --show-diff-on-failure \
              --color always -v
          else
            echo "Target branch is empty, run on all files."
            pre-commit run \
              --all-files \
              --show-diff-on-failure \
              --color always
          fi
