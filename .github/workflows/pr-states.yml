name: PR States
# One per-PR writer for both CI tracks, executing trusted default-branch code.
# Completion events refresh native/PPU attempts; workflow_dispatch provides an
# explicit refresh path, including fork reruns with read-only PR tokens.
# No PR head code or PR-controlled modules execute with this write token.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_run:
    workflows:
      - CI Pipeline
      - PR Test Base
      - PR Test Extra
      - PR Test ROCm 7.0 (AMD)
      - PR Test ROCm 7.2 (AMD)
      - PR Test Extra (AMD)
      - PR Test (Arm64)
      - PR Test (MLX)
      - PR Test (MUSA)
      - PR Test (NPU)
      - PR Test (Xeon)
      - PR Test (XPU)
      - PR Test (SMG)
      - PR Test (sgl-router)
      - PR Test (Rust extensions)
      - PR Test - SGL Kernel
      - PR Test - JIT Kernel
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose CI-states block should be refreshed.'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: resolve
        with:
          script: |
            const {resolvePr} = require('./scripts/ci/utils/pr_status.js');
            const number = await resolvePr(github, context);
            if (number) core.setOutput('number', number);

  update-pr-body:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.number != ''
    runs-on: ubuntu-latest
    concurrency:
      group: pr-states-${{ needs.resolve-pr.outputs.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update CI states block in PR body
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
        with:
          script: |
            const {update} = require('./scripts/ci/utils/pr_status.js');
            await update(github, context, core, Number(process.env.PR_NUMBER));
