name: Nightly Test (PPU)

on:
  schedule:
    - cron: '0 16 * * *'  # 0:00 AM Beijing Time (UTC+8) every day
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

# The board is no longer reached from a self-hosted `ppu` runner: each job runs
# on the CPU-only K8s runner group and submits a worker pod through
# flytiger-eco/ppu-distributed-action onto a board-type=OAM-810E node, as
# test-ppu-answer.yml and pr-test-ppu.yml do. The container setup lives in
# scripts/ci/ppu/run_nightly_suite_board.sh; only per-partition values vary here.
#
# The chain stays serial: nproc_per_node is a resource request, not device
# isolation, so two partitions of one board would gate each other in
# _wait_for_gpu_idle_in_ci.
#
# The action is pinned to the revision pr-test-ppu.yml uses, not @main, so the
# nightly ladder does not change mid-series (`uses:` cannot read `env:`).
env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  nightly-1a-ppu:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 155
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Resolve immutable image
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run nightly-1-ppu partition 1/2 via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/nas_aisw/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/nas_aisw/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-1-ppu,NIGHTLY_DEVICE_COUNT=1,NIGHTLY_PARTITION_ID=0,NIGHTLY_PARTITION_SIZE=2,NIGHTLY_MARLIN_PRELOAD=false,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B|/nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 125
          cleanup_policy: always

  nightly-1b-ppu:
    needs: [nightly-1a-ppu]
    if: always()
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # Higher than the other 1-GPU job: this partition owns test_marlin_moe, whose
    # JIT preload can cost ~18min on a cache miss; sized to fit the worst case
    # (preload cap + the test's own 1200s watchdog).
    timeout-minutes: 165
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Resolve immutable image
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      # Two variants, not four: v0.5.18 keyed this module's cache on
      # (dtype, is_ep, has_bias), so only the non-EP, no-bias variant that
      # test_fused_marlin_moe compiles is preloaded -- that keeps the preload
      # inside its 1500s cap. The EP variant is left to its own test budget.
      - name: Run nightly-1-ppu partition 2/2 via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/nas_aisw/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/nas_aisw/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-1-ppu,NIGHTLY_DEVICE_COUNT=1,NIGHTLY_PARTITION_ID=1,NIGHTLY_PARTITION_SIZE=2,NIGHTLY_MARLIN_PRELOAD=true,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B|/nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 135
          cleanup_policy: always

  nightly-2-ppu:
    needs: [nightly-1b-ppu]
    if: always()
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 175
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Resolve immutable image
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run nightly-2-ppu via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 2
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/nas_aisw/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/nas_aisw/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-2-ppu,NIGHTLY_DEVICE_COUNT=2,NIGHTLY_MARLIN_PRELOAD=false,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct|/nas_aisw/datasets/checkpoints/LLM/Llama/v3.2/Llama-3.2-1B-Instruct,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 145
          cleanup_policy: always

  nightly-4-ppu:
    needs: [nightly-2-ppu]
    if: always()
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 205
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Resolve immutable image
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run nightly-4-ppu via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 4
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/nas_aisw/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/nas_aisw/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-4-ppu,NIGHTLY_DEVICE_COUNT=4,NIGHTLY_MARLIN_PRELOAD=false,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.2/Llama-3.2-1B-Instruct,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 175
          cleanup_policy: always

  nightly-8-ppu:
    needs: [nightly-4-ppu]
    if: always()
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 315
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Resolve immutable image
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run nightly-8-ppu via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/nas_aisw/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/nas_aisw/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-8-ppu,NIGHTLY_DEVICE_COUNT=8,NIGHTLY_MARLIN_PRELOAD=false,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 285
          cleanup_policy: always

  nightly-test-ppu-finish:
    needs: [nightly-1a-ppu, nightly-1b-ppu, nightly-2-ppu, nightly-4-ppu, nightly-8-ppu]
    if: always()
    # Board-free: this job only reads the `needs` verdicts.
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
